<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suyog's Website</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    main {
      padding: 32px;
      max-width: 500px;
      text-align: center;
    }
    p { 
      color: #cbd5e1; 
      line-height: 1.5;
    }
    .badge {      
      display: inline-block;      
      padding: 5px 12px;      
      border: 1px solid #3a745f;      
      border-radius: 999px;      
      color: #8ee6bd;      
      font-size: 0.85rem;
      margin-bottom: 16px;
    }    
    @media (max-width: 480px) {      
      main { padding: 22px; }    
    }
  </style>
</head>
<body>  
  <main>    
    <span class="badge">My first website</span>    
    <h1>Hi, I'm Suyog 👋</h1>    
    <p>Welcome to my website. I am learning how to build websites and keep them secure.</p>  
  </main>
</body>
</html>
